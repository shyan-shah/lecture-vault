<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/vendor/katex.min.css">
<style>
:root{
  --bg:#0a0c11; --bg2:#0f1218; --panel:#12161e; --panel2:#171c26; --line:#1f2532; --line2:#2a3242;
  --text:#e7eaf0; --muted:#8b94a7; --faint:#5b6478;
  --done:#3ddc97; --avail:#f5b544; --proc:#7c9cff; --wait:#b18cff; --err:#ff6b6b; --none:#4b5366;
  --radius:12px; --hour:74px;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Instrument Sans",system-ui,sans-serif;
  background-image:radial-gradient(1200px 600px at 85% -10%,rgba(124,156,255,.08),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,rgba(61,220,151,.05),transparent 60%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#9fb4ff}
.mono{font-family:var(--mono)}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 20px;
  background:rgba(10,12,17,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:180px}
.logo{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 210deg,var(--proc),var(--done),var(--avail),var(--proc));
  box-shadow:0 0 18px rgba(124,156,255,.35);position:relative}
.logo::after{content:"";position:absolute;inset:7px;border-radius:4px;background:var(--bg)}
.brand b{font-size:15px;letter-spacing:.2px}
.brand small{color:var(--faint);display:block;font-size:11px;margin-top:-2px}
.nav{display:flex;align-items:center;gap:6px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:7px 12px;font-weight:500;
  transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:#1d2330;border-color:#36405a}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#8aa6ff,#6b88f5);border-color:#8aa6ff;color:#0b0f1d;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.4);color:var(--done)}
.btn.warn{background:rgba(245,181,68,.12);border-color:rgba(245,181,68,.45);color:var(--avail)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;padding:0}
#range{font-weight:600;min-width:170px;padding-left:6px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:3px}
.seg button{background:none;border:0;padding:5px 12px;border-radius:7px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);
  background:var(--panel);font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--none);flex:none}
.dot.ok{background:var(--done);box-shadow:0 0 8px var(--done)}
.dot.warn{background:var(--avail)} .dot.busy{background:var(--proc);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{display:none}
.switch .track{width:34px;height:20px;border-radius:999px;background:#262d3b;position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#aab3c5;transition:transform .2s,background .2s}
.switch input:checked + .track{background:rgba(61,220,151,.35)}
.switch input:checked + .track::after{transform:translateX(14px);background:var(--done)}

/* banner */
.banner{margin:14px 20px 0;padding:10px 14px;border-radius:10px;border:1px solid rgba(245,181,68,.35);
  background:rgba(245,181,68,.08);color:#f6d08d;display:flex;gap:12px;align-items:center}
.banner.err{border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.08);color:#ffb3b3}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px;padding:16px 20px 4px}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;
  position:relative;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line2);transform:translateY(-1px)}
.card.on{border-color:var(--mc);box-shadow:0 0 0 1px var(--mc) inset}
.card.dim{opacity:.45}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mc)}
.card .code{font-family:var(--mono);font-size:11.5px;color:var(--mc);letter-spacing:.3px}
.card .name{font-weight:600;font-size:13.5px;margin:2px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:99px;background:#1b212c;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.card .nums{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted)}
.card .big{font-size:20px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.card.overall{--mc:#e7eaf0;cursor:default}
.card.overall:hover{transform:none}

/* week */
main{padding:12px 20px 40px}
.week{display:grid;grid-template-columns:52px 1fr;background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.times{border-right:1px solid var(--line)}
.times .head{height:52px;border-bottom:1px solid var(--line)}
.times .t{height:var(--hour);font:11px var(--mono);color:var(--faint);text-align:right;padding:0 8px;transform:translateY(-7px)}
.days{display:grid}
.day{border-right:1px solid var(--line);min-width:0}
.day:last-child{border-right:0}
.dayhead{height:52px;border-bottom:1px solid var(--line);padding:8px 10px;display:flex;align-items:baseline;gap:8px}
.dayhead .dn{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.dayhead .dd{font-size:20px;font-weight:600}
.day.today .dayhead .dd{color:#0b0f1d;background:var(--proc);border-radius:8px;padding:0 7px}
.daybody{position:relative;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hour)}
.day.today .daybody{background-color:rgba(124,156,255,.03)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--err);z-index:2}
.nowline::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--err)}

.ev{position:absolute;border-radius:9px;padding:6px 8px 6px 10px;overflow:hidden;cursor:pointer;
  background:color-mix(in srgb,var(--mc) 13%,var(--panel));border:1px solid color-mix(in srgb,var(--mc) 30%,transparent);
  transition:transform .12s,box-shadow .12s,filter .12s;display:flex;flex-direction:column;gap:2px;z-index:3}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mc)}
.ev:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:4;filter:brightness(1.1)}
.ev.sel{box-shadow:0 0 0 2px var(--text);z-index:4}
.ev .row1{display:flex;justify-content:space-between;gap:6px;font:11px var(--mono);color:var(--mc)}
.ev .row1 .tm{color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--none)}
.sdot.done{background:var(--done)}.sdot.available{background:var(--avail)}.sdot.queued,.sdot.processing{background:var(--proc);animation:pulse 1s infinite}.sdot.waiting_captions,.sdot.pending_recording{background:var(--wait)}.sdot.error{background:var(--err)}.sdot.live{background:var(--err);animation:pulse 1s infinite}.sdot.upcoming{background:transparent;border:1px solid var(--faint)}
.ev .ttl{font-weight:600;font-size:12.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev.short .ttl{-webkit-line-clamp:1;flex:none}
.ev .foot{flex:none}
.ev .foot{margin-top:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--muted);white-space:nowrap}
.chip .dot{width:6px;height:6px}
.chip.st-done{color:var(--done);background:rgba(61,220,151,.12)} .chip.st-done .dot{background:var(--done)}
.chip.st-available{color:var(--avail);background:rgba(245,181,68,.12)} .chip.st-available .dot{background:var(--avail)}
.chip.st-queued,.chip.st-processing{color:var(--proc);background:rgba(124,156,255,.14)} .chip.st-queued .dot,.chip.st-processing .dot{background:var(--proc);animation:pulse 1s infinite}
.chip.st-waiting_captions{color:var(--wait);background:rgba(177,140,255,.13)} .chip.st-waiting_captions .dot{background:var(--wait)}
.chip.st-error{color:var(--err);background:rgba(255,107,107,.12)} .chip.st-error .dot{background:var(--err)}
.chip.st-upcoming,.chip.st-live{color:#c9d2e3} .chip.st-live .dot{background:var(--err);animation:pulse 1s infinite}
.chip.st-pending_recording{color:#c9d2e3} .chip.st-pending_recording .dot{background:var(--wait)}
.chip.mat{color:#c9d2e3}
.ev.st-no_recording,.ev.k-other{filter:saturate(.25);opacity:.55}
.ev.st-upcoming{background:transparent;border-style:dashed}
.ev.st-processing,.ev.st-queued{background-image:repeating-linear-gradient(135deg,rgba(124,156,255,.10) 0 10px,transparent 10px 20px);
  background-size:28px 28px;animation:stripes 1s linear infinite}
@keyframes stripes{to{background-position:28px 0}}
.ev.st-available{box-shadow:0 0 0 1px rgba(245,181,68,.35) inset}
.ev .mini{border:0;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;background:var(--avail);color:#1b1404}
.ev .mini:hover{filter:brightness(1.1)}
.ev.dim{opacity:.18}

/* modules view */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.mod{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mod header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.mod header .grow{flex:1;min-width:0}
.mod header .code{font:12px var(--mono);color:var(--mc)}
.mod header h3{margin:2px 0 4px;font-size:15px}
.mod header .sub{font-size:12px;color:var(--muted)}
.mod .acts{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.mod select{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:7px;padding:3px 6px;font:inherit;font-size:12px}
.lrow{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--panel)}
.lrow .d{font:12px var(--mono);color:var(--muted)}
.lrow .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .t small{display:block;color:var(--faint);font-weight:400;font-size:11.5px}
.lrow.future{opacity:.5}
.empty{padding:28px;text-align:center;color:var(--muted)}

.mdl{padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:#c9d1e0}
.mdl.err{color:#ffb3b3}
.mdl details summary{cursor:pointer;color:var(--muted);margin-top:4px}
.mdl details p{margin:6px 0 0;line-height:1.5}
.due-badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--avail);color:#1b1404;font-size:11px;font-weight:700;line-height:16px}
.review{max-width:820px;margin:0 auto}
.rv-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.rv-top .chipbtn{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted)}
.rv-top .chipbtn.on{border-color:var(--proc);color:var(--text);background:rgba(124,156,255,.12)}
.rv-card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line2);border-radius:16px;padding:26px 28px;min-height:260px;display:flex;flex-direction:column;gap:14px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.rv-meta{font:12px var(--mono);color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.rv-front{font-size:19px;line-height:1.5;font-weight:500}
.rv-back{border-top:1px dashed var(--line2);padding-top:14px;font-size:15.5px;line-height:1.6}
.rv-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.rv-actions .btn{flex:1;min-width:120px;padding:10px}
.g1{border-color:rgba(255,107,107,.5);color:#ffb3b3}.g2{border-color:rgba(245,181,68,.5);color:var(--avail)}
.g3{border-color:rgba(61,220,151,.5);color:var(--done)}.g4{border-color:rgba(124,156,255,.6);color:#a9bcff}
.rv-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.rv-link{display:flex;justify-content:flex-start}
.rv-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.rv-tags .chipbtn{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--text)}
.rv-tags .chipbtn:hover{border-color:var(--proc)}
.rv-front{max-height:none}
.rv-progress{height:4px;border-radius:9px;background:#1b212c;overflow:hidden;margin-bottom:12px}
.rv-progress span{display:block;height:100%;background:var(--done);transition:width .3s}
.todayview{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;align-items:start}
@media (max-width:1000px){.todayview{grid-template-columns:1fr}}
.tcard{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.tcard h3{margin:0 0 12px;font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.next{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:11px;background:var(--panel);border:1px solid var(--line2);margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.next:hover{border-color:var(--mc,var(--proc))}
.next .u{width:8px;height:8px;border-radius:50%;flex:none}
.next .u3{background:var(--err);box-shadow:0 0 8px var(--err)}.next .u2{background:var(--avail)}.next .u1{background:var(--proc)}.next .u0{background:var(--none)}
.next .t{flex:1;min-width:0}.next .t b{display:block;font-size:14px}.next .t small{color:var(--muted)}
.next .k{font:11px var(--mono);color:var(--muted)}
.prio{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:72px 1fr 60px;gap:10px;align-items:center}
.prow .code{font:12px var(--mono);color:var(--mc)}
.prow .bar{height:8px}
.prow .h{text-align:right;font-size:12px;color:var(--muted)}
.prow .why{grid-column:2/4;font-size:11.5px;color:var(--faint);margin-top:-4px}
.work{border-top:1px solid var(--line);padding:10px 0}
.work:first-of-type{border-top:0}
.work .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.work .hd b{font-size:13.5px}
.work .hd .code{font:11px var(--mono)}
.work .hd .due{font-size:11.5px;color:var(--muted);margin-left:auto}
.work .due.soon{color:var(--avail)}.work .due.now{color:var(--err)}
.qgrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.q{width:34px;height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);font:12px var(--mono);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.q.correct{background:rgba(61,220,151,.18);border-color:rgba(61,220,151,.5);color:var(--done)}
.q.partial{background:rgba(245,181,68,.18);border-color:rgba(245,181,68,.5);color:var(--avail)}
.q.wrong{background:rgba(255,107,107,.18);border-color:rgba(255,107,107,.5);color:#ffb3b3}
.q.skipped{opacity:.5;text-decoration:line-through}
.q.add{border-style:dashed}
.ms{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.ms label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.ms input{accent-color:var(--done)}
.ms .pct{margin-left:auto;font:11px var(--mono);color:var(--muted)}
.markpop{position:fixed;z-index:50;background:#1c2230;border:1px solid var(--line2);border-radius:12px;padding:10px;box-shadow:0 14px 40px rgba(0,0,0,.5);width:280px}
.markpop .row{display:flex;gap:6px;margin-bottom:8px}
.markpop .row .btn{flex:1;padding:6px 4px;font-size:12px}
.markpop select,.markpop input{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font:inherit;font-size:12.5px;margin-bottom:6px}
.rate{display:flex;gap:4px;align-items:center}
.rate button{width:30px;height:28px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:12px}
.rate button.on{background:rgba(61,220,151,.18);border-color:rgba(61,220,151,.5);color:var(--done)}
.plan-box{max-width:820px}
.asm{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.asmchip{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--faint)}
.asmchip.on{border-color:color-mix(in srgb,var(--mc) 60%,transparent);color:var(--text);background:color-mix(in srgb,var(--mc) 16%,transparent)}
.modal .notes input[type=checkbox]{width:auto;padding:0;margin:0 8px 0 0;vertical-align:-2px;accent-color:var(--done)}
.notes ul:has(input[type=checkbox]){list-style:none;padding-left:4px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.plan-box .notes{font-size:14.5px}
.plan-box .notes li{margin:4px 0}
.modbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;color:var(--muted);font-size:13px}
.modbar span{margin-right:auto}
.banner .spin{display:inline-block;margin-right:8px;vertical-align:middle}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);background:var(--bg2);border-left:1px solid var(--line2);
  transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:31;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhead{padding:18px 22px 14px;border-bottom:1px solid var(--line);position:relative}
.dhead .close{position:absolute;right:14px;top:14px}
.dhead .code{font:12px var(--mono);color:var(--mc)}
.dhead h2{margin:4px 40px 6px 0;font-size:20px;line-height:1.25}
.dhead .meta{color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.dbody{overflow:auto;padding:16px 22px 40px;flex:1}
.statusbox{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.statusbox .grow{flex:1;min-width:0}
.statusbox .step{color:var(--muted);font-size:12.5px}
.statusbox .errtxt{color:#ffb3b3;font-size:12.5px;word-break:break-word}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(124,156,255,.25);border-top-color:var(--proc);animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sec{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;background:var(--panel)}
.sec > h4{margin:0;padding:11px 14px;font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sec > h4 .r{margin-left:auto;text-transform:none;letter-spacing:0}
.sec .in{padding:12px 14px}
.matline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;letter-spacing:.2px}
.badge.file{background:rgba(124,156,255,.15);color:#a9bcff}
.badge.pack{background:rgba(177,140,255,.16);color:#cbb3ff}
.badge.none{background:rgba(255,255,255,.06);color:var(--muted)}
.badge.manual{background:rgba(245,181,68,.15);color:var(--avail)}
.why{color:var(--faint);font-size:12px;margin-top:6px}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.form select,.form input{background:var(--bg2);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
.form input[type=number]{width:72px}
.cmp{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--done) calc(var(--p)*1%),#222936 0)}
.ring div{width:76px;height:76px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center}
.ring b{font-size:20px} .ring small{display:block;font-size:10px;color:var(--muted);margin-top:-3px}
.cmpstats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cmpstats div{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.cmpstats b{font-size:18px} .cmpstats span{display:block;font-size:11.5px;color:var(--muted)}
details.lst{border-top:1px solid var(--line);padding:9px 0}
details.lst summary{cursor:pointer;font-weight:600;font-size:13px;list-style:none;display:flex;gap:8px;align-items:center}
details.lst summary::-webkit-details-marker{display:none}
details.lst summary::before{content:"▸";color:var(--faint);transition:transform .15s}
details.lst[open] summary::before{transform:rotate(90deg)}
details.lst ul{margin:8px 0 2px;padding-left:20px;color:#cdd3df}
details.lst li{margin:4px 0}
details.lst .ref{color:var(--faint);font:11.5px var(--mono)}
.notes{line-height:1.6;font-size:14.5px}
.notes h1,.notes h2,.notes h3{line-height:1.25;margin:1.3em 0 .5em}
.notes h2{font-size:18px;border-bottom:1px solid var(--line);padding-bottom:6px}
.notes h3{font-size:15.5px}
.notes code{font-family:var(--mono);background:#1a202b;padding:1px 5px;border-radius:5px;font-size:.9em}
.notes pre{background:#0d1016;border:1px solid var(--line);padding:12px;border-radius:9px;overflow:auto}
.notes blockquote{margin:0;padding:4px 12px;border-left:3px solid var(--proc);color:#c4cbe0;background:rgba(124,156,255,.06);border-radius:0 8px 8px 0}
.notes table{border-collapse:collapse;width:100%} .notes td,.notes th{border:1px solid var(--line2);padding:6px 8px}
.notes details{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0}
.notes .katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
.notes a[href*="start="]{font-family:var(--mono);font-size:.85em;text-decoration:none;background:rgba(124,156,255,.12);padding:1px 6px;border-radius:5px}
.placeholder{color:var(--muted);text-align:center;padding:30px 10px}

/* modal */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(0,0,0,.55)}
.modal[hidden]{display:none}
.modal .box{width:min(620px,94vw);max-height:88vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:20px 22px}
.modal h3{margin:0 0 14px}
.modal .row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.modal .row:last-child{border-bottom:0}
.modal label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.modal input,.modal select{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
.kv{font-size:13px} .kv span{color:var(--muted)}
.folders li{display:flex;justify-content:space-between;align-items:center;gap:8px;font:12px var(--mono);padding:5px 0}
.folders{list-style:none;padding:0;margin:6px 0}

/* toasts */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1c2230;border:1px solid var(--line2);padding:9px 14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:tin .2s ease-out;font-size:13px}
.toast.err{border-color:rgba(255,107,107,.5);color:#ffc2c2}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

@media (max-width:900px){
  .top{flex-wrap:wrap}.brand{min-width:0}.spacer{display:none}
  .week{overflow-x:auto}.days{min-width:700px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo"></span><div><b>Lecture Vault</b><small>Panopto → notes → Vault</small></div></div>
  <div class="nav">
    <button class="btn icon-btn" id="prev" title="Previous week">‹</button>
    <button class="btn" id="todayBtn">Today</button>
    <button class="btn icon-btn" id="next" title="Next week">›</button>
    <div id="range"></div>
  </div>
  <div class="seg" id="viewSeg"><button data-view="today">Today</button><button data-view="week" class="on">Week</button><button data-view="modules">Modules</button><button data-view="review">Review <span id="dueBadge" class="due-badge" hidden></span></button></div>
  <div class="spacer"></div>
  <label class="switch" title="Process new recordings as soon as Panopto lists them"><input type="checkbox" id="autoT"><span class="track"></span>Auto transcribe</label>
  <span class="pill" id="queuePill"></span>
  <span id="authSlot"></span>
  <button class="btn" id="syncBtn">Sync</button>
  <button class="btn icon-btn" id="settingsBtn" title="Settings">⚙</button>
</header>
<div id="bannerSlot"></div>
<section class="stats" id="stats"></section>
<main><div id="view"></div></main>

<div id="scrim"></div>
<aside class="drawer" id="drawer"><div class="dhead" id="dhead"></div><div class="dbody" id="dbody"></div></aside>

<div class="modal" id="settings" hidden><div class="box" id="settingsBox"></div></div>
<div id="toasts"></div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/katex.min.js"></script>
<script src="/static/vendor/auto-render.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {"Content-Type": "application/json", "X-Lecture-Vault": "1"}});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || j.error || r.statusText);
  return j;
}
const post = (p, body) => api(p, {method: "POST", body: JSON.stringify(body || {})});
function toast(msg, err) {
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3200);
}
async function act(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg); await load(); return r; }
  catch (e) { toast(e.message, true); }
}

const S = {view: "week", weekStart: monday(new Date()), data: null, filter: null, sel: null, notesFor: null, notesStatus: null, timer: null};
function monday(d) { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const hm = d => d.toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"});
const fmtDay = d => d.toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short"});
const ago = iso => { if (!iso) return "never"; const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : `${Math.round(m/1440)} d ago`; };

const STATUS = {
  done: "Noted", available: "Not noted", queued: "Queued", processing: "Processing", waiting_captions: "Awaiting captions",
  error: "Failed", upcoming: "Upcoming", live: "Live now", pending_recording: "Recording pending", no_recording: "Not recorded"
};
const ACTIVE = new Set(["queued", "processing"]);
const modColor = code => (S.data?.modules.find(m => m.code === code) || {}).color || "#8b94a7";
const modName = code => (S.data?.modules.find(m => m.code === code) || {}).name || code || "Unassigned";

async function load() {
  let start, end;
  if (S.view === "week") { start = S.weekStart; end = addDays(start, 7); }
  else if (S.view === "review" || S.view === "today") { start = addDays(new Date(), -1); end = addDays(new Date(), 1); }
  else { start = addDays(new Date(), -150); end = addDays(new Date(), 45); }
  try {
    S.data = await api(`/api/state?start=${ymd(start)}&end=${ymd(end)}`);
  } catch (e) { toast("Can't reach the app server: " + e.message, true); schedule(8000); return; }
  render();
  const busy = S.data.worker.pending.length || S.data.lectures.some(l => ACTIVE.has(l.status));
  schedule(busy ? 2500 : 30000);
}
function schedule(ms) { clearTimeout(S.timer); S.timer = setTimeout(load, ms); }

/* ---------- header, banner, stats ---------- */
function renderTop() {
  const d = S.data;
  $("#range").textContent = S.view === "week"
    ? `${S.weekStart.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${addDays(S.weekStart,6).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}`
    : "Whole semester";
  ["#prev","#next","#todayBtn"].forEach(s => $(s).style.visibility = S.view === "week" ? "visible" : "hidden");
  $("#range").textContent = S.view === "today" ? `Week ${(S.data.engine || {}).week || "?"}` : $("#range").textContent;
  $("#autoT").checked = d.settings.auto_transcribe;
  const q = d.worker.pending.filter(k => k !== "sync" && k !== "login").length;
  const syncing = d.worker.pending.includes("sync");
  $("#queuePill").innerHTML = q ? `<span class="dot busy"></span>${q} in queue` : syncing ? `<span class="dot busy"></span>Syncing` : `<span class="dot ok"></span>Synced ${ago(d.last_sync)}`;
  $("#syncBtn").disabled = syncing;
  const auth = d.auth;
  $("#authSlot").innerHTML = auth === "ok" ? `<span class="pill"><span class="dot ok"></span>Panopto</span>`
    : auth === "signing_in" ? `<span class="pill"><span class="dot busy"></span>Sign in in the browser window</span>`
    : `<button class="btn warn" id="loginBtn">Sign in to Panopto</button>`;
  const lb = $("#loginBtn"); if (lb) lb.onclick = login;

  let banner = "";
  if (d.last_error) banner += `<div class="banner err">⚠ ${esc(d.last_error)}</div>`;
  const mo = d.moodle || {};
  if (mo.auth === "expired") banner += `<div class="banner">Moodle needs you to sign in before it can fetch your module files. <button class="btn sm" onclick="login()">Sign in</button></div>`;
  else if (mo.error) banner += `<div class="banner err">Moodle: ${esc(mo.error)}</div>`;
  if (mo.step) banner += `<div class="banner" style="border-color:rgba(124,156,255,.4);background:rgba(124,156,255,.08);color:#c7d3ff"><span class="spin"></span>${esc(mo.step)}</div>`;
  if (!d.settings.timetable_configured) banner += `<div class="banner">Add your timetable iCal link as <span class="mono">TIMETABLE_ICS_URL</span> in .env to see scheduled lectures (and spot ones that weren't recorded). Recordings still appear without it.</div>`;
  else if (d.settings.timetable_error) banner += `<div class="banner err">Timetable: ${esc(d.settings.timetable_error)}</div>`;
  if (!d.settings.watch_folders.length && d.last_sync) banner += `<div class="banner">No Panopto folders added, so sync lists everything Panopto shows you. Add module folders in ⚙ for cleaner results. <button class="btn sm" onclick="openSettings()">Add folder</button></div>`;
  $("#bannerSlot").innerHTML = banner;
}

function renderStats() {
  const d = S.data, cards = [];
  if (S.view === "today" || S.view === "review") { $("#stats").innerHTML = ""; return; }
  const tot = Object.values(d.stats).reduce((a, s) => { for (const k in s) a[k] = (a[k] || 0) + s[k]; return a; }, {});
  const pct = tot.recorded ? Math.round(100 * tot.noted / tot.recorded) : 0;
  cards.push(`<div class="card overall"><div class="code">ALL MODULES</div><div class="name">Semester coverage</div>
    ${bar(tot)}<div class="nums"><span><span class="big">${pct}%</span> noted</span><span>${tot.to_note || 0} to do · ${tot.no_recording || 0} unrecorded</span></div></div>`);
  for (const m of d.modules.concat(d.stats.unassigned ? [{code: "unassigned", name: "Unassigned", color: "#8b94a7"}] : [])) {
    const s = d.stats[m.code]; if (!s) continue;
    const on = S.filter === m.code, dim = S.filter && !on;
    cards.push(`<div class="card ${on ? "on" : ""} ${dim ? "dim" : ""}" style="--mc:${m.color}" data-filter="${esc(m.code)}">
      <div class="code">${esc(m.code === "unassigned" ? "—" : m.code)}</div><div class="name" title="${esc(m.name)}">${esc(m.name)}</div>
      ${bar(s)}<div class="nums"><span><span class="big">${s.noted}</span>/${s.recorded} noted</span>
      <span>${s.to_note ? `<b style="color:var(--avail)">${s.to_note}</b> to do` : s.active ? `${s.active} running` : s.recorded ? "all done ✓" : "—"}</span></div></div>`);
  }
  $("#stats").innerHTML = cards.join("");
  document.querySelectorAll("[data-filter]").forEach(el => el.onclick = () => {
    S.filter = S.filter === el.dataset.filter ? null : el.dataset.filter; render();
  });
}
function bar(s) {
  const t = Math.max(1, s.scheduled || s.recorded || 0);
  const seg = (n, c) => n ? `<span style="width:${100*n/t}%;background:${c}"></span>` : "";
  return `<div class="bar">${seg(s.noted, "var(--done)")}${seg(s.active, "var(--proc)")}${seg(s.to_note, "var(--avail)")}${seg(s.no_recording, "#3a4152")}</div>`;
}

/* ---------- week view ---------- */
function renderWeek() {
  const lec = S.data.lectures.map(l => ({...l, s: new Date(l.start), e: new Date(l.end)}));
  const days = [...Array(7)].map((_, i) => addDays(S.weekStart, i));
  const weekend = lec.some(l => [0, 6].includes(l.s.getDay()));
  const shown = weekend ? days : days.slice(0, 5);
  let h0 = 8, h1 = 19;
  for (const l of lec) { h0 = Math.min(h0, l.s.getHours()); h1 = Math.max(h1, l.e.getHours() + (l.e.getMinutes() ? 1 : 0)); }
  h0 = Math.max(6, h0); h1 = Math.min(23, h1);
  const H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour"));
  const now = new Date();

  let times = `<div class="head"></div>`;
  for (let h = h0; h < h1; h++) times += `<div class="t">${String(h).padStart(2,"0")}:00</div>`;

  const cols = shown.map(day => {
    const evs = lec.filter(l => l.s.toDateString() === day.toDateString());
    layoutLanes(evs);
    const isToday = day.toDateString() === now.toDateString();
    const blocks = evs.map(l => {
      const top = ((l.s.getHours() + l.s.getMinutes()/60) - h0) * H + 2;
      const ht = Math.max(30, ((l.e - l.s) / 3600000) * H - 4);
      const w = 100 / l.lanes;
      const dim = S.filter && l.module_code !== S.filter ? " dim" : "";
      const kind = l.kind && l.kind !== "lecture" && !l.delivery_id ? " k-other" : "";
      const matChip = l.materials ? `<span class="chip mat" title="${esc(l.materials.name)}">${l.materials.mode === "pack" ? "📚 pack" : "📄 slides"}</span>` : "";
      const btn = (l.status === "available" || l.status === "error") && ht > 54
        ? `<button class="mini" data-tx="${l.delivery_id}">${l.status === "error" ? "Retry" : "Transcribe"}</button>` : "";
      const label = kind ? (l.kind[0].toUpperCase() + l.kind.slice(1)) : STATUS[l.status] || l.status;
      return `<div class="ev st-${l.status}${kind}${dim}${ht < 90 ? " short" : ""}${S.sel === l.id ? " sel" : ""}" data-id="${esc(l.id)}"
        style="top:${top}px;height:${ht}px;left:calc(${l.lane * w}% + 3px);width:calc(${w}% - 6px);--mc:${modColor(l.module_code)}">
        <div class="row1"><span>${esc(l.module_code || "—")}</span><span class="tm">${hm(l.s)}<i class="sdot ${l.status}" title="${esc(label)}"></i></span></div>
        <div class="ttl">${esc(l.notes_title || l.title)}</div>
        ${ht > 54 ? `<div class="foot"><span class="chip st-${l.status}"><span class="dot"></span>${esc(label)}</span>${ht > 80 ? matChip : ""}${btn}</div>` : ""}
      </div>`;
    }).join("");
    let nowline = "";
    if (isToday) {
      const y = ((now.getHours() + now.getMinutes()/60) - h0) * H;
      if (y > 0 && y < (h1 - h0) * H) nowline = `<div class="nowline" style="top:${y}px"></div>`;
    }
    return `<div class="day ${isToday ? "today" : ""}"><div class="dayhead"><span class="dn">${day.toLocaleDateString("en-GB",{weekday:"short"})}</span><span class="dd">${day.getDate()}</span></div>
      <div class="daybody" style="height:${(h1 - h0) * H}px">${blocks}${nowline}</div></div>`;
  }).join("");

  const empty = !lec.length ? `<div class="empty">No lectures this week${S.data.settings.timetable_configured ? "" : " (timetable not connected)"}. Use ‹ › to move between weeks.</div>` : "";
  $("#view").innerHTML = `<div class="week"><div class="times">${times}</div><div class="days" style="grid-template-columns:repeat(${shown.length},1fr)">${cols}</div></div>${empty}`;
}
function layoutLanes(evs) {
  evs.sort((a, b) => a.s - b.s || b.e - a.e);
  let cluster = [], end = 0;
  const flush = () => { const lanes = []; for (const e of cluster) { let i = lanes.findIndex(x => x <= e.s); if (i < 0) i = lanes.length; lanes[i] = e.e; e.lane = i; } for (const e of cluster) e.lanes = lanes.length; cluster = []; };
  for (const e of evs) { if (cluster.length && e.s >= end) { flush(); end = 0; } cluster.push(e); end = Math.max(end, +e.e); }
  flush();
}

/* ---------- modules view ---------- */
function renderModules() {
  const lec = S.data.lectures.map(l => ({...l, s: new Date(l.start)}));
  const codes = S.data.modules.map(m => m.code);
  if (lec.some(l => !l.module_code || !codes.includes(l.module_code))) codes.push("unassigned");
  const now = Date.now();
  const html = codes.filter(c => !S.filter || S.filter === c).map(code => {
    const m = S.data.modules.find(x => x.code === code) || {code, name: "Unassigned", color: "#8b94a7", materials_mode: "auto"};
    const rows = lec.filter(l => (l.module_code && codes.includes(l.module_code) ? l.module_code : "unassigned") === code)
      .filter(l => l.delivery_id || l.kind === "lecture");
    const st = S.data.stats[code] || {noted: 0, recorded: 0, to_note: 0};
    const fc = (S.data.module_files || {})[code];
    const filesLine = fc ? `<div class="sub" style="margin-top:3px">📄 ${fc.slides} lecture files · 📚 ${fc.packs} pack${fc.packs === 1 ? "" : "s"} · ❓ ${fc.questions} question file${fc.questions === 1 ? "" : "s"}${fc.info ? ` · ℹ ${fc.info} info` : ""}</div>` : "";
    const ms = ((S.data.moodle || {}).modules || {})[code];
    const moodleBlock = code === "unassigned" ? "" : ms ? (ms.error
      ? `<div class="mdl err">Moodle: ${esc(ms.error)} <button class="btn sm ghost" data-mcourse="${esc(code)}">Set course link</button></div>`
      : `<div class="mdl"><div class="mdl-h"><b>Moodle</b> · ${esc(ms.course || "")}${ms.profile?.layout ? ` · ${esc(ms.profile.layout)}` : ""}${ms.profile?.lecture_material ? ` · lectures backed by ${esc({per_lecture: "individual files", pack: "one pack", mixed: "files and a pack", none: "nothing"}[ms.profile.lecture_material] || ms.profile.lecture_material)}` : ""}</div>
         ${ms.profile?.summary ? `<details><summary>How this module uses Moodle</summary><p>${esc(ms.profile.summary)}</p></details>` : ""}</div>`)
      : `<div class="mdl" style="color:var(--muted)">Moodle not synced yet</div>`;
    const list = rows.map(l => `<div class="lrow ${l.s > now ? "future" : ""}" data-id="${esc(l.id)}">
        <span class="d">${l.s.toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}<br>${hm(l.s)}</span>
        <span class="t">${esc(l.notes_title || l.title)}<small>${l.materials ? (l.materials.mode === "pack" ? `📚 ${esc(l.materials.name)} ${l.materials.unit}.${l.materials.pages[0]}–${l.materials.pages[1]}` : `📄 ${esc(l.materials.name)}`) : (l.coverage_pct != null ? "" : "")}${l.coverage_pct != null ? ` · ${Math.round(l.coverage_pct)}% of material covered` : ""}</small></span>
        <span class="chip st-${l.status}"><span class="dot"></span>${STATUS[l.status] || l.status}</span></div>`).join("") || `<div class="empty">Nothing yet</div>`;
    const modeSel = code === "unassigned" ? "" : `<span style="font-size:12px;color:var(--muted);margin-left:auto">Materials:</span>

function statusText(l) {

async function wireMaterials(l) {
  const ed = $("#matEdit"); if (!ed) return;
  document.querySelectorAll("[data-openfile]").forEach(b => b.onclick = () => act(() => post("/api/open", {target: "material_file", file: b.dataset.openfile})));

    if (!l.module_code) return toast("Lecture has no module yet", true);
    let info; try { info = await api(`/api/materials/${l.module_code}`); } catch (e) { return toast(e.message, true); }
    const opts = [`<option value="auto">Auto match</option>`, `<option value="none">No materials</option>`]
      .concat(info.per_lecture.map(f => `<option value="f:${esc(f.file)}">📄 ${esc(f.name)}</option>`))
      .concat(info.packs.map(f => `<option value="p:${esc(f.file)}" data-pages="${f.pages || ""}">📚 ${esc(f.name)} (pack, ${f.pages ?? "?"} ${f.unit === "slide" ? "slides" : "pages"})</option>`));
    $("#matForm").innerHTML = `<div class="form"><select id="matSel">${opts.join("")}</select>
      <span id="pg" hidden>pages <input type="number" id="pa" min="1"> to <input type="number" id="pb" min="1"></span>
      <button class="btn sm primary" id="matSave">Save</button><button class="btn sm ghost" id="matCancel">Cancel</button></div>
      <div class="why">Folder: ${esc(info.dir)} · detected as <b>${esc(info.mode)}</b>. Files in a <span class="mono">pack</span> subfolder are packs, files in <span class="mono">questions</span> are example questions, everything else is per lecture.</div>`;
    const sel = $("#matSel");
    const cur = l.materials_override;
    if (cur?.mode === "none") sel.value = "none";
    else if (cur?.file) sel.value = (cur.pages ? "p:" : "f:") + cur.file;
    const sync = () => { const p = sel.value.startsWith("p:"); $("#pg").hidden = !p;
      if (p && !$("#pa").value) { const mm = l.materials; if (mm?.pages && mm.file === sel.value.slice(2)) { $("#pa").value = mm.pages[0]; $("#pb").value = mm.pages[1]; } } };
    sel.onchange = sync; sync();
    $("#matCancel").onclick = () => { $("#matForm").innerHTML = ""; S.drawerSig = null; render(); };
    $("#matSave").onclick = () => {
      const v = sel.value; let body;
      if (v === "auto" || v === "none") body = {mode: v};
      else if (v.startsWith("f:")) body = {mode: "file", file: v.slice(2)};
      else { const a = +$("#pa").value, b = +$("#pb").value; if (!a || !b) return toast("Enter a page range", true); body = {mode: "file", file: v.slice(2), pages: [a, b]}; }
      $("#matForm").innerHTML = "";
      act(() => post(`/api/lectures/${l.delivery_id}/materials`, body), l.status === "done" ? "Saved. Re-run notes to apply" : "Saved");
    };
  };
}

function renderMd(el, md) {
  const math = [];
  const safe = md.replace(/\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g, m => { math.push(m); return `@@M${math.length - 1}@@`; });
  let html = marked.parse(safe, {gfm: true, breaks: false});
  html = html.replace(/@@M(\d+)@@/g, (_, i) => esc(math[+i]));
  el.innerHTML = html;
  el.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  try { renderMathInElement(el, {delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}], throwOnError: false}); } catch {}
}

    try {
      const r = await api(`/api/review/due?limit=80${S.rv.module ? `&module=${encodeURIComponent(S.rv.module)}` : ""}`);
      S.rv.cards = r.cards; S.rv.total = r.cards.length; S.rv.i = 0; S.rv.shown = false; S.rv.loadedFor = S.rv.module || "";
    } catch (e) { host.innerHTML = `<div class="rv-empty">${esc(e.message)}</div>`; return; }
  }
  const st = (S.data.review || {}).stats || {};
  const chips = [`<button class="chipbtn ${!S.rv.module ? "on" : ""}" data-rvm="">All modules · ${Object.values(st).reduce((a, v) => a + v.due, 0)} due</button>`]
    .concat(S.data.modules.map(m => `<button class="chipbtn ${S.rv.module === m.code ? "on" : ""}" data-rvm="${esc(m.code)}" style="--mc:${m.color}">${esc(m.code)} · ${(st[m.code] || {}).due || 0}</button>`));
  const c = S.rv.cards[S.rv.i];
  let body;
  const examMod = S.rv.module && (S.data.modules.find(m => m.code === S.rv.module) || {}).assessment?.exam;
  if (!c) body = `<div class="rv-card"><div class="rv-empty">${S.rv.total ? "Done for today. Questions you missed come back in a couple of days."
      : examMod ? "No practice questions due. Each tutorial sheet, past paper and worked example becomes questions here as soon as Moodle posts it."
      : "Nothing due. New lectures add cards automatically."}</div></div>`;
  else body = `<div class="rv-progress"><span style="width:${100 * S.rv.i / Math.max(1, S.rv.total)}%"></span></div>
    <div class="rv-card" style="--mc:${modColor(c.module_code)}">
      <div class="rv-meta"><span style="color:${modColor(c.module_code)}">${esc(c.module_code || "")}</span><span>${esc(c.lecture_title || "")}</span><span>${esc(c.kind)}</span><span>${c.reps ? `seen ${c.reps}×` : "new"}${c.lapses ? ` · missed ${c.lapses}×` : ""}</span><span style="margin-left:auto">${S.rv.i + 1} / ${S.rv.total}</span></div>
      <div class="rv-front" id="rvFront"></div>
      ${S.rv.shown ? `<div class="rv-back" id="rvBack"></div>` : ""}
      ${c.work_id && c.delivery_id ? `<div class="rv-link"><button class="btn sm ghost" id="rvLecture">Open lecture: ${esc(c.lecture_title || "notes")}</button></div>` : ""}
      <div class="rv-actions">${!S.rv.shown
        ? `<button class="btn primary" id="rvShow">${c.work_id ? "Attempt it, then show the method" : "Show answer"} <small>space</small></button>`
        : c.work_id
        ? `<button class="btn g3" data-r="correct">✓ Right <small>1</small></button><button class="btn g2" data-r="partial">½ Half <small>2</small></button><button class="btn g1" data-r="wrong">✗ Wrong <small>3</small></button><button class="btn ghost" data-r="skipped">Skip <small>4</small></button>`
        : `<button class="btn g1" data-g="1">Again <small>1</small></button><button class="btn g2" data-g="2">Hard <small>2</small></button><button class="btn g3" data-g="3">Good <small>3</small></button><button class="btn g4" data-g="4">Easy <small>4</small></button>`}</div>
      ${S.rv.pending ? `<div class="rv-tags"><span>Why?</span>${((S.data.engine || {}).error_tags || []).filter(t => t !== "not attempted").map(t => `<button class="chipbtn" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}<button class="chipbtn" data-tag="">skip</button></div>` : ""}
    </div>`;
  host.innerHTML = `<div class="review"><div class="rv-top">${chips.join("")}</div>${body}</div>`;
  host.querySelectorAll("[data-rvm]").forEach(b => b.onclick = () => { S.rv = {module: b.dataset.rvm}; renderReview(); });
  if (c) {
    renderMd($("#rvFront"), c.front);
    if (S.rv.shown) renderMd($("#rvBack"), c.back);
    const show = $("#rvShow"); if (show) show.onclick = () => { S.rv.shown = true; renderReview(); };
    host.querySelectorAll("[data-g]").forEach(b => b.onclick = () => gradeCard(+b.dataset.g));
    host.querySelectorAll("[data-r]").forEach(b => b.onclick = () => markQuestion(b.dataset.r));
    host.querySelectorAll("[data-tag]").forEach(b => b.onclick = () => markQuestion(S.rv.pending, b.dataset.tag || null));
    const lec = $("#rvLecture"); if (lec) lec.onclick = () => openLectureFrom(c.delivery_id, c.lecture_date);
  }
}
async function markQuestion(result, tag) {
  const c = S.rv.cards[S.rv.i]; if (!c) return;
  if ((result === "wrong" || result === "partial") && tag === undefined) { S.rv.pending = result; renderReview(); return; }
  S.rv.pending = null;
  let r;
  try { r = await post(`/api/review/${c.id}`, {result, tag}); } catch (e) { return toast(e.message, true); }
  toast(result === "correct" ? `Logged · back in ${r.interval} days` : `Logged${tag ? ` (${tag})` : ""} · retry in ${r.interval} days · sheet ${Math.round(r.score_pct)}%`);
  S.rv.i++; S.rv.shown = false; renderReview();
}
async function openLectureFrom(id, dateStr) {
  if (dateStr) S.weekStart = monday(new Date(dateStr));
  switchView("week");
  await load();
  openDrawer(id);
}
async function gradeCard(g) {
  const c = S.rv.cards[S.rv.i]; if (!c) return;
  try { await post(`/api/review/${c.id}`, {grade: g}); } catch (e) { return toast(e.message, true); }
  if (g === 1) S.rv.cards.push(c);  // see it again this session
  S.rv.i++; S.rv.shown = false; renderReview();
}
document.addEventListener("keydown", e => {
  if (S.view !== "review" || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); if (!S.rv?.shown) { S.rv.shown = true; renderReview(); } }
  if (S.rv?.shown && ["1", "2", "3", "4"].includes(e.key)) {
    const c = S.rv.cards[S.rv.i];
    if (c && c.work_id) { if (!S.rv.pending) markQuestion(["correct", "partial", "wrong", "skipped"][+e.key - 1]); }
    else gradeCard(+e.key);
  }
});

/* ---------- today ---------- */
function dueLabel(d) { if (d == null) return ""; return d < 0 ? `${-d}d overdue` : d === 0 ? "due today" : d === 1 ? "due tomorrow" : `due in ${d}d`; }
function dueClass(d) { return d == null ? "" : d <= 1 ? "now" : d <= 5 ? "soon" : ""; }
function daysTo(s) { if (!s) return null; const d = new Date(s.slice(0, 10)); if (isNaN(d)) return null; return Math.round((d - new Date().setHours(0,0,0,0)) / 86400000); }
function renderToday() {
  const e = S.data.engine || {priorities: [], work: [], next: []};
  const st = (S.data.review || {}).stats || {};
  const nextHtml = e.next.length ? e.next.map(a => `<div class="next" data-next="${esc(a.kind)}" data-wid="${esc(a.work_id || "")}" data-mod="${esc(a.module || "")}" style="--mc:${modColor(a.module)}">
      <span class="u u${a.urgency}"></span><span class="t"><b>${esc(a.label)}</b><small>${esc(a.module || "")}${a.days != null ? ` · ${dueLabel(a.days)}` : ""}</small></span><span class="k">${a.kind}</span></div>`).join("")
    : `<div class="placeholder">Nothing pending. Press Sync, or add work from a module card.</div>`;
  const maxS = Math.max(1, ...e.priorities.map(p => p.score));
  const prio = e.priorities.length ? e.priorities.map(p => `<div class="prow" style="--mc:${modColor(p.module_code)}"><span class="code">${esc(p.module_code)}</span>
      <div class="bar"><span style="width:${100 * p.score / maxS}%;background:var(--mc)"></span></div><span class="h">${p.hours}h</span>
      <span class="why">${esc(p.reasoning)}</span></div>`).join("")
    : `<div class="placeholder">Priorities appear after the first scoring pass.<br><button class="btn sm" id="engRun">Score now</button></div>`;
  const works = e.work.filter(w => w.status !== "completed");
  const done = e.work.filter(w => w.status === "completed");
  $("#view").innerHTML = `<div class="todayview">
    <div>
      <div class="tcard"><h3>Do next</h3>${nextHtml}</div>
      <div class="tcard" style="margin-top:16px"><h3>Open work <span style="float:right;text-transform:none;letter-spacing:0">${done.length} completed</span></h3>
        ${works.length ? works.map(workHtml).join("") : `<div class="placeholder">No tutorial sheets or coursework tracked yet. They're picked up from Moodle on the next scoring pass.</div>`}
        <div style="margin-top:10px"><button class="btn sm ghost" id="addWork">+ Add work manually</button></div></div>
    </div>
    <div>
      <div class="tcard"><h3>This week's priority <span style="float:right;text-transform:none;letter-spacing:0">${e.last ? ago(e.last) : ""}</span></h3><div class="prio">${prio}</div>
        ${e.error ? `<div class="why" style="color:#ffb3b3;margin-top:8px">${esc(e.error)}</div>` : ""}
        <div style="margin-top:10px;display:flex;gap:6px"><button class="btn sm" id="engRun2">Re-score</button><button class="btn sm" onclick="switchView('review')">Review ${(S.data.review||{}).due_total || 0} cards</button></div></div>
      <div class="tcard" style="margin-top:16px"><h3>Modules</h3>${S.data.modules.map(m => { const p = e.priorities.find(x => x.module_code === m.code) || {}; const c = st[m.code] || {};
        return `<div class="prow" style="--mc:${m.color};grid-template-columns:72px 1fr auto"><span class="code">${esc(m.code)}</span><span style="font-size:12.5px">${esc(m.name)}</span>
          <span style="font-size:11.5px;color:var(--muted)">${p.coverage != null ? `notes ${Math.round(p.coverage)}%` : ""}${p.retention != null ? ` · recall ${Math.round(p.retention)}%` : ""}${c.due ? ` · ${c.due} due` : ""}</span></div>`; }).join("")}</div>
    </div></div>`;
  wireWork();
  document.querySelectorAll("#engRun,#engRun2").forEach(b => b.onclick = () => act(() => post("/api/engine/run"), "Scoring: about a minute"));
  document.querySelectorAll("[data-next]").forEach(el => el.onclick = () => {
    const k = el.dataset.next;
    if (k === "review") switchView("review");
    else if (k === "plan") openPlan(el.dataset.mod);
    else { const w = document.querySelector(`[data-work="${el.dataset.wid}"]`); if (w) { w.scrollIntoView({behavior: "smooth", block: "center"}); w.style.outline = "1px solid var(--proc)"; setTimeout(() => w.style.outline = "", 1500); } }
  });
  $("#addWork").onclick = () => {
    const mod = prompt("Module code (as in your setup, e.g. ME32029)?"); if (!mod) return;
    const title = prompt("Title (e.g. Tutorial sheet 3)?"); if (!title) return;
    const type = (prompt("Type: tutorial, past_paper or coursework?", "tutorial") || "tutorial").trim();
    const n = type === "coursework" ? null : parseInt(prompt("How many questions?", "6") || "0", 10) || null;
    act(() => post("/api/work/add", {module: mod.trim().toUpperCase(), title, work_type: type, total_questions: n}), "Added");
  };
}
function workHtml(w) {
  const d = daysTo(w.due_date);
  const head = `<div class="hd"><span class="code" style="color:${modColor(w.module_code)}">${esc(w.module_code)}</span><b>${esc(w.title)}</b>
    <span class="chip">${w.work_type === "coursework" ? "coursework" : w.work_type === "past_paper" ? "past paper" : "tutorial"}${w.week ? ` · wk ${w.week}` : ""}</span>
    ${w.score_pct != null ? `<span class="chip st-${w.score_pct >= 70 ? "done" : w.score_pct >= 40 ? "available" : "error"}"><span class="dot"></span>${Math.round(w.score_pct)}%</span>` : ""}
    <span class="due ${dueClass(d)}">${w.due_date ? dueLabel(d) || esc(w.due_date) : ""}</span></div>`;
  if (w.work_type === "coursework") {
    return `<div class="work" data-work="${esc(w.id)}">${head}<div class="ms">${(w.milestones || []).map((m, i) => `<label><input type="checkbox" data-ms="${esc(w.id)}" data-name="${esc(m.name)}" ${m.done ? "checked" : ""}>${esc(m.name)}<span class="pct">${m.done ? "done" : (m.pct || 0) + "%"}</span></label>`).join("")}</div>
      <div style="margin-top:6px"><button class="btn sm ghost" data-fb="${esc(w.id)}">Log feedback mark</button></div></div>`;
  }
  const n = w.total_questions || Math.max(Object.keys(w.question_marks || {}).length, 0);
  const cells = [];
  for (let i = 1; i <= n; i++) { const m = (w.question_marks || {})[String(i)]; cells.push(`<div class="q ${m ? m.result : ""}" data-q="${i}" data-wid="${esc(w.id)}" title="${m ? esc(m.result + (m.tag ? " · " + m.tag : "")) : "Click to mark"}">${i}</div>`); }
  cells.push(`<div class="q add" data-addq="${esc(w.id)}" title="Add a question">+</div>`);
  return `<div class="work" data-work="${esc(w.id)}">${head}<div class="qgrid">${cells.join("")}</div></div>`;
}
function wireWork() {
  document.querySelectorAll("[data-q]").forEach(el => el.onclick = ev => markPop(ev, el.dataset.wid, el.dataset.q));
  document.querySelectorAll("[data-addq]").forEach(el => el.onclick = () => {
    const w = (S.data.engine.work || []).find(x => x.id === el.dataset.addq); const n = (w.total_questions || Object.keys(w.question_marks || {}).length) + 1;
    act(() => post(`/api/work/${w.id}/meta`, {total_questions: n}));
  });
  document.querySelectorAll("[data-ms]").forEach(el => el.onchange = () => act(() => post(`/api/work/${el.dataset.ms}/milestone`, {name: el.dataset.name, done: el.checked}), el.checked ? "Milestone done" : "Reopened"));
  document.querySelectorAll("[data-fb]").forEach(el => el.onclick = () => {
    const v = prompt("Mark or feedback score (%)?"); if (v === null || v === "") return;
    const notes = prompt("Feedback notes (optional)") || "";
    act(() => post(`/api/work/${el.dataset.fb}/meta`, {feedback_score: parseFloat(v), feedback_notes: notes}), "Logged");
  });
}
function markPop(ev, wid, q) {
  document.querySelectorAll(".markpop").forEach(p => p.remove());
  const pop = document.createElement("div"); pop.className = "markpop";
  const tags = (S.data.engine.error_tags || []).map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
  pop.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:6px">Q${esc(q)}</div>
    <div class="row"><button class="btn g3" data-r="correct">✓ Right</button><button class="btn g2" data-r="partial">½</button><button class="btn g1" data-r="wrong">✗ Wrong</button><button class="btn ghost" data-r="skipped">Skip</button></div>
    <select id="mpTag"><option value="">Why? (for wrong / partial)</option>${tags}</select>
    <input id="mpTopic" placeholder="Topic keyword to drill (optional)">
    <div style="display:flex;justify-content:flex-end"><button class="btn sm ghost" id="mpClose">Close</button></div>`;
  document.body.appendChild(pop);
  const r = ev.target.getBoundingClientRect();
  pop.style.left = Math.min(window.innerWidth - 300, r.left) + "px"; pop.style.top = (r.bottom + 6) + "px";
  $("#mpClose").onclick = () => pop.remove();
  pop.querySelectorAll("[data-r]").forEach(b => b.onclick = async () => {
    const body = {question: q, result: b.dataset.r, tag: $("#mpTag").value || null, topic: $("#mpTopic").value || null};
    pop.remove();
    await act(() => post(`/api/work/${wid}/mark`, body), r => r.cards_boosted ? `Marked · ${r.cards_boosted} cards brought forward` : `Marked · ${Math.round(r.score_pct)}%`);
  });
  setTimeout(() => document.addEventListener("click", function h(e) { if (!pop.contains(e.target)) { pop.remove(); document.removeEventListener("click", h); } }), 0);
}

/* ---------- weekly plan ---------- */
async function openPlan(code) {
  const box = $("#settingsBox");
  $("#settings").hidden = false;
  box.classList.add("plan-box");
  box.innerHTML = `<h3>${esc(code)} · ${esc(modName(code))}: weekly plan</h3><div id="planBody" class="placeholder"><div class="spin" style="margin:0 auto 8px"></div>Loading…</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn" id="planMake">Rebuild plan</button><button class="btn" id="planClose">Close</button></div>`;
  $("#planClose").onclick = () => { $("#settings").hidden = true; box.classList.remove("plan-box"); };
  $("#planMake").onclick = () => act(() => post(`/api/plan/${code}`), "Writing a fresh plan: you'll get a notification").then(() => { $("#settings").hidden = true; box.classList.remove("plan-box"); });
  try {
    const pl = await api(`/api/plan/${code}`);
    if (!pl.markdown) { $("#planBody").innerHTML = `No plan yet for this week. Press <b>Rebuild plan</b> and it'll be ready in a minute or two.`; return; }
    $("#planBody").className = "notes";
    $("#planBody").innerHTML = "";
    renderMd($("#planBody"), `*Week of ${pl.week_start}*\n\n` + pl.markdown);
  } catch (e) { $("#planBody").textContent = e.message; }
}

/* ---------- wiring ---------- */
function render() {
  if (!S.data) return;
  renderTop(); renderStats();
  if (S.view === "review") { if (!S.rv?.cards || $("#view").querySelector(".review") === null) renderReview(); }
  else if (S.view === "today") renderToday();
  else S.view === "week" ? renderWeek() : renderModules();
  const due = (S.data.review || {}).due_total || 0;
  const badge = $("#dueBadge"); badge.hidden = !due; badge.textContent = due;
  if (S.sel) {
    const sig = JSON.stringify(current() || null);
    const editing = $("#matForm") && $("#matForm").innerHTML.trim();
    if (sig !== S.drawerSig && !editing) { S.drawerSig = sig; renderDrawer(); }
  }
}
$("#view").addEventListener("click", e => {
  const tx = e.target.closest("[data-tx]");
  if (tx) { e.stopPropagation(); return act(() => post(`/api/lectures/${tx.dataset.tx}/transcribe`), "Queued for transcription"); }
  const el = e.target.closest("[data-id]"); if (el) openDrawer(el.dataset.id);
});
$("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("#settings").hidden = true; closeDrawer(); }
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowLeft" && S.view === "week") $("#prev").click();
  if (e.key === "ArrowRight" && S.view === "week") $("#next").click();
});
$("#prev").onclick = () => { S.weekStart = addDays(S.weekStart, -7); load(); };
$("#next").onclick = () => { S.weekStart = addDays(S.weekStart, 7); load(); };
$("#todayBtn").onclick = () => { S.weekStart = monday(new Date()); load(); };
$("#viewSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; switchView(b.dataset.view); };
$("#syncBtn").onclick = () => act(() => post("/api/sync"), "Syncing with Panopto");
$("#autoT").onchange = e => act(() => post("/api/settings", {auto_transcribe: e.target.checked}),
  e.target.checked ? "Auto transcribe on: new recordings are processed as they appear" : "Auto transcribe off");
$("#settingsBtn").onclick = openSettings;
$("#settings").onclick = e => { if (e.target.id === "settings") $("#settings").hidden = true; };
load();
</script>
</body>
</html>
